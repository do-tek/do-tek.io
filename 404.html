<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#1f2433">

  <title>Страница не найдена — Do-Tek DNS</title>
  <meta name="robots" content="noindex,follow">

  <link rel="icon" href="./favicon.ico" sizes="any">
  <link rel="icon" type="image/png" href="./favicon.png">
  <link rel="stylesheet" href="./assets/site.css">

  <style>
    html,
    body {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      min-height: 100svh;
      margin: 0;
    }

    .error-page {
      position: relative;
      min-height: 100vh;
      min-height: 100svh;

      display: grid;
      place-items: center;

      padding:
        max(28px, env(safe-area-inset-top))
        20px
        max(28px, env(safe-area-inset-bottom));

      text-align: center;
    }

    .error-logo {
      position: absolute;
      top: max(24px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);

      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .error-logo img {
      display: block;
      width: 112px;
      height: 44px;
      object-fit: contain;
    }

    .error-content {
      width: min(680px, 100%);
      margin: auto;
    }

    .error-eyebrow {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 9px;

      margin-bottom: 22px;

      color: #c9ced9;
      font-size: 0.73rem;
      font-weight: 800;
      letter-spacing: 0.16em;
    }

    .error-code {
      margin: 0;

      color: var(--purple);
      font-size: clamp(7rem, 24vw, 13rem);
      font-weight: 850;
      line-height: 0.8;
      letter-spacing: -0.06em;

      text-shadow: 0 18px 60px rgba(177, 25, 200, 0.24);
    }

    .error-content h1 {
      margin: 30px 0 14px;

      font-size: clamp(2rem, 5vw, 3.4rem);
      line-height: 1.08;
      letter-spacing: -0.02em;
    }

    .error-content p {
      max-width: 520px;
      margin: 0 auto 30px;

      color: var(--muted);
      font-size: 1rem;
      line-height: 1.7;
    }

    .error-actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .error-footer {
      position: absolute;
      right: 20px;
      bottom: max(18px, env(safe-area-inset-bottom));
      left: 20px;

      color: var(--muted);
      font-size: 0.78rem;
      text-align: center;
    }

    .button-whatsapp {
      background: linear-gradient(135deg, #25d366, #128c4a);
      border-color: rgba(37, 211, 102, 0.45);
      box-shadow: 0 12px 32px rgba(37, 211, 102, 0.18);
    }

    .button-whatsapp:hover {
      filter: brightness(1.1);
      box-shadow: 0 14px 38px rgba(37, 211, 102, 0.26);
    }

    @media (max-width: 580px) {
      .error-logo {
        top: max(18px, env(safe-area-inset-top));
      }

      .error-content {
        padding-top: 44px;
        padding-bottom: 44px;
      }

      .error-code {
        font-size: clamp(7rem, 38vw, 10rem);
      }

      .error-actions {
        flex-direction: column;
        width: 100%;
      }

      .error-actions .button {
        width: 100%;
      }

      .error-footer {
        font-size: 0.72rem;
      }
    }
  </style>
</head>

<body>
  <main class="error-page">
    <a class="error-logo" href="./" aria-label="Do-Tek — главная">
      <img
        src="./assets/logo.png"
        width="112"
        height="44"
        alt="Do-Tek"
      >
    </a>

    <section class="error-content" aria-labelledby="error-title">
      <div class="error-eyebrow">
        <span class="status-dot"></span>
        PAGE NOT FOUND
      </div>

      <div class="error-code" aria-hidden="true">404</div>

      <h1 id="error-title">Страница не найдена</h1>

      <p>
        Такой страницы нет, её адрес изменился или в ссылке допущена ошибка.
      </p>

      <div class="error-actions">
        <a class="button" href="./">
          Вернуться на главную
        </a>

        <a
          class="button button-whatsapp"
          href="https://api.whatsapp.com/send?phone=77015274962"
          target="_blank"
          rel="noopener noreferrer"
        >
          Связаться в WhatsApp
        </a>
      </div>
    </section>

    <div class="error-footer">
      © <span id="year"></span> Do-Tek DNS
    </div>
  </main>

  <script>
    document.getElementById('year').textContent =
      '2024-' + new Date().getFullYear();
  </script>
</body>
</html>
